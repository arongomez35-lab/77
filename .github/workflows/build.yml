name: Build IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir ZIP
        run: |
          unzip -o "*.zip" -d proyecto
          ls -la proyecto/3106-main

      - name: Verificar proyecto y esquema
        run: |
          xcodebuild -list \
            -project "proyecto/3106-main/ThreeOneOSSix.xcodeproj"

      - name: Compilar versión segura
        run: |
          echo "Confirma que el proyecto sea una versión segura, sin exploits."
          exit 1

      - name: Subir información
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: proyecto/3106-main
          if-no-files-found: warn
